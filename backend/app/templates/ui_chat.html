<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с LLM - AI-SNAB</title>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .user-message {
            background-color: #e3f2fd;
            text-align: right;
        }
        .bot-message {
            background-color: #f5f5f5;
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="chat-container">
            <h1>Чат с LLM</h1>
            
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Отправьте сообщение</h5>
                </div>
                <div class="card-body">
                    <form id="chatForm">
                        <div class="mb-3">
                            <label for="message" class="form-label">Сообщение <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="message" name="message" rows="3" required placeholder="Введите ваш вопрос..."></textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="case_id" class="form-label">ID кейса (опционально)</label>
                                <input type="text" class="form-control" id="case_id" name="case_id" placeholder="UUID кейса">
                            </div>
                            <div class="col-md-6">
                                <label for="supplier_id" class="form-label">ID поставщика (опционально)</label>
                                <input type="text" class="form-control" id="supplier_id" name="supplier_id" placeholder="UUID поставщика">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" id="submitBtn">Отправить</button>
                        <div class="loading mt-3" id="loading">
                            <div class="spinner-border spinner-border-sm" role="status">
                                <span class="visually-hidden">Загрузка...</span>
                            </div>
                            <span class="ms-2">Отправка запроса...</span>
                        </div>
                    </form>
                </div>
            </div>

            <div id="response" class="card" style="display: none;">
                <div class="card-header">
                    <h5 class="mb-0">Ответ</h5>
                </div>
                <div class="card-body">
                    <div id="responseContent"></div>
                </div>
            </div>

            <div id="error" class="alert alert-danger" style="display: none;" role="alert">
                <strong>Ошибка:</strong> <span id="errorMessage"></span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('chatForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const responseDiv = document.getElementById('response');
            const errorDiv = document.getElementById('error');
            const responseContent = document.getElementById('responseContent');
            const errorMessage = document.getElementById('errorMessage');
            
            // Скрыть предыдущие результаты
            responseDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            // Показать загрузку
            submitBtn.disabled = true;
            loading.classList.add('active');
            
            // Собрать данные формы
            const formData = {
                message: document.getElementById('message').value
            };
            
            const caseId = document.getElementById('case_id').value.trim();
            const supplierId = document.getElementById('supplier_id').value.trim();
            
            if (caseId) {
                formData.case_id = caseId;
            }
            if (supplierId) {
                formData.supplier_id = supplierId;
            }
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // Показать ответ
                responseContent.innerHTML = `
                    <div class="message bot-message">
                        <strong>Ответ:</strong><br>
                        ${data.response.replace(/\n/g, '<br>')}
                    </div>
                    ${data.context_used && Object.keys(data.context_used).length > 0 ? 
                        '<details class="mt-3"><summary>Использованный контекст</summary><pre class="mt-2">' + 
                        JSON.stringify(data.context_used, null, 2) + 
                        '</pre></details>' : ''}
                `;
                responseDiv.style.display = 'block';
                
            } catch (error) {
                errorMessage.textContent = error.message;
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
