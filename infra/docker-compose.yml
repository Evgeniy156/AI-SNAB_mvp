services:
  database:
    image: postgres:16
    container_name: aisnab_database
    environment:
      POSTGRES_DB: aisnab
      POSTGRES_USER: aisnab
      POSTGRES_PASSWORD: aisnab
    ports:
      - "5432:5432"
    volumes:
      - aisnab_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aisnab_minio
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aisnab_minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: aisnab_redis
    ports:
      - "6379:6379"
    volumes:
      - aisnab_redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aisnab_ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: aisnab_app
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/backend/app
      - aisnab_local_data:/data
    depends_on:
      - database
      - minio
      - redis
      - ollama
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: aisnab_worker
    env_file:
      - ../.env
    volumes:
      - ../backend/app:/app/backend/app
      - aisnab_local_data:/data
    depends_on:
      - database
      - redis
    command: bash -lc "cd /app/backend && rq worker -u redis://redis:6379/0"
    restart: unless-stopped

  web-proxy:
    image: nginx:stable
    container_name: aisnab_web_proxy
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  aisnab_pg_data:
  aisnab_minio_data:
  aisnab_redis_data:
  aisnab_local_data:
  ollama:
